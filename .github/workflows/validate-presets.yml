name: Validate presets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh

      - name: Syntax-check JavaScript
        run: |
          for f in scripts/*.js; do
            node --check "$f"
          done

  validate:
    name: Validate presets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run preset validation
        run: bash scripts/validate-presets.sh

  generators:
    name: Generator determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate synthetic kernels
        run: |
          node scripts/generate-synthetic-crossfeed.js
          node scripts/generate-synthetic-binaural-room.js

      - name: Verify generated kernels are unchanged
        run: git diff --exit-code -- irs/
